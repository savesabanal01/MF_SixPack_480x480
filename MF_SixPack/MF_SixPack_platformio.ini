; ******************************************************************************************
; working environment for template of custom firmware
; ******************************************************************************************
; Common build settings across this custom device
[env_MF_SixPack]
build_flags =
	${env.build_flags}												; include standard build flags
	-DMF_CUSTOMDEVICE_SUPPORT=1										; Required for Custom Devices
	; -DMF_CUSTOMDEVICE_HAS_UPDATE									; if the custom device needs to be updated, uncomment this. W/o the following define it will be done each loop()
	; -DMF_CUSTOMDEVICE_POLL_MS=10 									; time in ms between updating custom device, uncomment this if custom device needs to be updated regulary
	;-DHAS_CONFIG_IN_FLASH											; undefine this and add your configuration to MFCustomDevicesConfig.h to save the config in Flash !!Core FW version must be at least 2.5.2!!
	;-DREVERSED_OUTPUT_OUTPUT										; for reversed output logic on outputs
	;-DREVERSED_OUTPUT_OUTPUTSHIFTER								; for reversed output logic on outputshifter
	;-DDEBUG2CMDMESSENGER											; uncomment this to get debug messages for the connector log
	-I./src/src/MF_CustomDevice										; don't change this one!
	-I./MF_SixPack													; Include files for your custom device, replace "MF_SixPack" by your folder name
build_src_filter = 
	+<../MF_SixPack>													; build files for your custom device, replace "MF_SixPack" by your folder name
lib_deps =															; You can add additional libraries if required
	lovyan03/LovyanGFX@^1.2.7
	robtillaart/RunningAverage@^0.4.8
custom_core_firmware_version = ESP32_support	; CAUTION check get_version.py								; define the version from the core firmware files your build should base on
custom_source_folder = MF_SixPack										; path to your Custom Device Sources, replace "MF_SixPack" by your folder name
custom_community_project = 	SaveS_MF_SixPack_AI							; Folder name inside zip file, also ZIP file name if "custom_zip_filename" is not changed
custom_zip_filename = ${env_MF_SixPack.custom_community_project}		; Name of the zip-file, overwrite it to define an different zip-file name

[env:saves_mf_sixpack_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8v-guition
framework = arduino
lib_ldf_mode = deep+
build_flags =
	${env_MF_SixPack.build_flags}
	-I./src/_Boards/ESP32/ESP32S3_Devkit
	'-DMOBIFLIGHT_TYPE="MF_SixPack AI"'				; this must match with "MobiFlightType" within the .json file
	'-DMOBIFLIGHT_NAME="MF_SixPack AI"'
	; -DARDUINO_USB_MODE=1				; commented for Guition
    ; -DARDUINO_USB_CDC_ON_BOOT=1		; commented for Guition
    -DBOARD_HAS_PSRAM
	-DBUFFER_LENGTH=I2C_BUFFER_LENGTH
	;-DUSE_2ND_CORE
	-DMEMLEN_CONFIG=3000											; max. size for config which wil be stored in EEPROM
	-DMEMLEN_NAMES_BUFFER=2000										; max. size for configBuffer, contains only names from inputs
	-DMF_MAX_DEVICEMEM=2000		
build_unflags =
  -Wdeprecated-declarations
;  -Werror=return-type
build_src_filter =
  ${env.build_src_filter}
  ${env_MF_SixPack.build_src_filter}
lib_deps =
	${env.lib_deps}
	${env.custom_lib_deps_ESP32}											; don't change this one!
	${env_MF_SixPack.lib_deps}
; board_build.arduino.memory_type = qio_opi	; required for PSRAM enabled
; board_build.memory_type = qio_opi
; monitor_speed = 115200
board_build.arduino.memory_type = qio_opi	; required for PSRAM enabled
board_build.memory_type = qio_opi ; added for Guition
board_build.flash_mode = qio ; added for Guition
board_build.f_cpu = 240000000L ; added for Guition
board_build.f_flash = 80000000L ; added for Guition
board_build.partitions = default_16MB.csv	; added for Guition
monitor_speed = 115200
extra_scripts = 
	${env.extra_scripts}
custom_core_firmware_version = ${env_MF_SixPack.custom_core_firmware_version}	; don't change this one!
custom_community_project = ${env_MF_SixPack.custom_community_project}			; don't change this one!
custom_source_folder = ${env_MF_SixPack.custom_source_folder}					; don't change this one!
custom_zip_filename = ${env_MF_SixPack.custom_zip_filename}			; don't change this one!
